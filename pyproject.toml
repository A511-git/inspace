[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inspace"
version = "0.1.0"
description = "InSpace: Structure-Aware 3D Indoor Scene Generation from a Single 360° Image"
readme = "README.md"
requires-python = ">=3.10, <3.13"
license = { text = "MIT" }
authors = [
    { name = "Gwanhyeong Koo", email = "kookie12@kaist.ac.kr" },
    { name = "NAVER LABS / KAIST" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

# Minimal base dependencies
dependencies = [
    "torch==2.6.0",
    "torchvision==0.21.0",
    "numpy",
    "scipy",
    "pandas",
    "tqdm",
    "easydict",
    "zstandard",
    "safetensors",
    "huggingface_hub",
    "ninja",
]

[project.optional-dependencies]
# Minimal inference & Gradio demo: uv sync --extra infer (or uv sync -E infer)
infer = [
    "opencv-python-headless",
    "imageio",
    "imageio-ffmpeg",
    "Pillow",
    "scikit-image",
    "trimesh",
    "plyfile",
    "open3d",
    "pyrender",
    "py360convert",
    "kornia",
    "timm",
    "matplotlib",
    "plotly",
    "transformers",
    "gradio>=5.0.0,<=6.0.1",
    "utils3d @ git+https://github.com/EasternJournalist/utils3d.git@9a4eb15e4021b67b12c460c7057d642626897ec8",
]

# Pre-compiled CUDA wheels for Python 3.10 Linux x86_64 (Kaggle / Colab)
# Instant install without compiling from source: uv sync -E infer -E cuda-wheels
cuda-wheels = [
    "o_voxel @ https://huggingface.co/microsoft/TRELLIS.2/resolve/main/wheels/o_voxel-0.0.1-cp310-cp310-linux_x86_64.whl ; sys_platform == 'linux' and python_version == '3.10'",
    "cumesh @ https://huggingface.co/microsoft/TRELLIS.2/resolve/main/wheels/cumesh-0.0.1-cp310-cp310-linux_x86_64.whl ; sys_platform == 'linux' and python_version == '3.10'",
    "flex_gemm @ https://huggingface.co/microsoft/TRELLIS.2/resolve/main/wheels/flex_gemm-0.0.1-cp310-cp310-linux_x86_64.whl ; sys_platform == 'linux' and python_version == '3.10'",
    "nvdiffrast @ git+https://github.com/NVlabs/nvdiffrast.git@v0.4.0",
    "nvdiffrec @ git+https://github.com/JeffreyXiang/nvdiffrec.git@renderutils",
]

# Build CUDA extensions from source (fallback for custom architectures):
cuda-build = [
    "cumesh @ git+https://github.com/JeffreyXiang/CuMesh.git",
    "flex_gemm @ git+https://github.com/JeffreyXiang/FlexGEMM.git",
    "nvdiffrast @ git+https://github.com/NVlabs/nvdiffrast.git@v0.4.0",
    "nvdiffrec @ git+https://github.com/JeffreyXiang/nvdiffrec.git@renderutils",
]

# Attention backend for Turing / Kaggle T4 / V100: uv sync -E infer -E xformers
xformers = [
    "xformers",
]

# Attention backend for Ampere / Hopper (A100, RTX 3090/4090): uv sync -E infer -E flash-attn
flash-attn = [
    "flash-attn==2.7.3",
]

# Training dependencies
train = [
    "tensorboard",
]

# Benchmark evaluation metrics & scripts
eval = [
    "lpips",
    "pytorch3d @ git+https://github.com/facebookresearch/pytorch3d.git@stable",
]

# PEP 735 Dependency Groups (uv sync --group infer --group cuda-wheels)
[dependency-groups]
infer = [
    "opencv-python-headless",
    "imageio",
    "imageio-ffmpeg",
    "Pillow",
    "scikit-image",
    "trimesh",
    "plyfile",
    "open3d",
    "pyrender",
    "py360convert",
    "kornia",
    "timm",
    "matplotlib",
    "plotly",
    "transformers",
    "gradio>=5.0.0,<=6.0.1",
    "utils3d @ git+https://github.com/EasternJournalist/utils3d.git@9a4eb15e4021b67b12c460c7057d642626897ec8",
]
cuda-wheels = [
    "o_voxel @ https://huggingface.co/microsoft/TRELLIS.2/resolve/main/wheels/o_voxel-0.0.1-cp310-cp310-linux_x86_64.whl ; sys_platform == 'linux' and python_version == '3.10'",
    "cumesh @ https://huggingface.co/microsoft/TRELLIS.2/resolve/main/wheels/cumesh-0.0.1-cp310-cp310-linux_x86_64.whl ; sys_platform == 'linux' and python_version == '3.10'",
    "flex_gemm @ https://huggingface.co/microsoft/TRELLIS.2/resolve/main/wheels/flex_gemm-0.0.1-cp310-cp310-linux_x86_64.whl ; sys_platform == 'linux' and python_version == '3.10'",
    "nvdiffrast @ git+https://github.com/NVlabs/nvdiffrast.git@v0.4.0",
    "nvdiffrec @ git+https://github.com/JeffreyXiang/nvdiffrec.git@renderutils",
]
dev = [
    "tensorboard",
    "lpips",
]

# uv-specific configuration: auto-fetch PyTorch CUDA 12.4 wheels instead of CPU-only PyPI
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
xformers = { index = "pytorch-cu124" }
o_voxel = { url = "https://huggingface.co/microsoft/TRELLIS.2/resolve/main/wheels/o_voxel-0.0.1-cp310-cp310-linux_x86_64.whl" }
cumesh = { url = "https://huggingface.co/microsoft/TRELLIS.2/resolve/main/wheels/cumesh-0.0.1-cp310-cp310-linux_x86_64.whl" }
flex_gemm = { url = "https://huggingface.co/microsoft/TRELLIS.2/resolve/main/wheels/flex_gemm-0.0.1-cp310-cp310-linux_x86_64.whl" }
nvdiffrast = { git = "https://github.com/NVlabs/nvdiffrast.git", tag = "v0.4.0" }
nvdiffrec = { git = "https://github.com/JeffreyXiang/nvdiffrec.git", branch = "renderutils" }

[tool.setuptools.packages.find]
where = ["."]
include = ["trellis2*", "demo*", "data_toolkit*", "eval*"]
