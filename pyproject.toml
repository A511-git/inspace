[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inspace"
version = "0.1.0"
description = "InSpace: Structure-Aware 3D Indoor Scene Generation from a Single 360° Image"
readme = "README.md"
requires-python = ">=3.10, <3.13"
license = { text = "MIT" }
authors = [
    { name = "Gwanhyeong Koo", email = "kookie12@kaist.ac.kr" },
    { name = "NAVER LABS / KAIST" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

# Core runtime + build tools
dependencies = [
    "torch==2.6.0",
    "torchvision==0.21.0",
    "setuptools>=64",
    "wheel",
    "ninja",
    "numpy",
    "scipy",
    "pandas",
    "tqdm",
    "easydict",
    "zstandard",
    "safetensors",
    "huggingface_hub",
]

[project.optional-dependencies]
# Minimal inference & Gradio demo: uv sync --extra infer (or uv sync -E infer)
infer = [
    "opencv-python-headless",
    "imageio",
    "imageio-ffmpeg",
    "Pillow",
    "scikit-image",
    "trimesh",
    "plyfile",
    "open3d",
    "pyrender",
    "py360convert",
    "kornia",
    "timm",
    "matplotlib",
    "plotly",
    "transformers",
    "gradio>=5.0.0,<=6.0.1",
    "utils3d @ git+https://github.com/EasternJournalist/utils3d.git@9a4eb15e4021b67b12c460c7057d642626897ec8",
]

# Pre-compiled CUDA wheels for cu124 + torch2.6 + Python 3.10
# (from https://pozzettiandrea.github.io/cuda-wheels/)
cuda-wheels = [
    "cumesh==0.0.1+cu124torch26",
    "flex-gemm==1.0.0+cu124torch26",
    "nvdiffrast==0.4.0+cu124torch26",
    "nvdiffrec-render==0.0.1+cu124torch26",
    "o-voxel==0.0.1+cu124torch26",
]

# Attention backend for Turing / Kaggle T4 / V100: uv sync -E infer -E xformers
xformers = [
    "xformers",
]

# Attention backend for Ampere / Hopper (A100, RTX 3090/4090): uv sync -E infer -E flash-attn
flash-attn = [
    "flash-attn==2.7.3",
]

# Training dependencies
train = [
    "tensorboard",
]

# Benchmark evaluation metrics
eval = [
    "lpips",
]

[tool.uv]
default-groups = ["infer"]

# PyTorch CUDA 12.4 index
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

# Precompiled CUDA Wheels index (PozzettiAndrea)
[[tool.uv.index]]
name = "cuda-wheels"
url = "https://pozzettiandrea.github.io/cuda-wheels/"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
xformers = { index = "pytorch-cu124" }
cumesh = { index = "cuda-wheels" }
flex-gemm = { index = "cuda-wheels" }
nvdiffrast = { index = "cuda-wheels" }
nvdiffrec-render = { index = "cuda-wheels" }
o-voxel = { index = "cuda-wheels" }

[tool.setuptools.packages.find]
where = ["."]
include = ["trellis2*", "demo*", "data_toolkit*", "eval*"]
