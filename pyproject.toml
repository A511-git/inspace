[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inspace"
version = "0.1.0"
description = "InSpace: Structure-Aware 3D Indoor Scene Generation from a Single 360° Image"
readme = "README.md"
requires-python = "==3.10.*"
license = { text = "MIT" }
authors = [
    { name = "Gwanhyeong Koo", email = "kookie12@kaist.ac.kr" },
    { name = "NAVER LABS / KAIST" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
]

# All dependencies auto-installed by: uv sync --python 3.10
dependencies = [
    # PyTorch stack + attention (CUDA 12.8)
    "torch",
    "torchvision",
    "xformers",

    # Build tools & numerical core
    "setuptools>=64",
    "wheel",
    "ninja",
    "numpy",
    "scipy",
    "pandas",
    "tqdm",
    "easydict",
    "zstandard",
    "safetensors",
    "huggingface_hub",

    # 2D & 3D Vision, Geometry & Rendering
    "opencv-python-headless",
    "imageio",
    "imageio-ffmpeg",
    "Pillow",
    "scikit-image",
    "trimesh",
    "plyfile",
    "open3d",
    "pyrender",
    "py360convert",
    "kornia",
    "timm",
    "matplotlib",
    "plotly",
    "transformers",
    "gradio>=5.0.0,<=6.0.1",
    "utils3d @ git+https://github.com/EasternJournalist/utils3d.git@9a4eb15e4021b67b12c460c7057d642626897ec8",
    "lpips",

    # Precompiled CUDA Wheels (CUDA 12.8 from PozzettiAndrea/cuda-wheels)
    "cumesh<0.0.1+cu130",
    "flex-gemm<1.0.0+cu130",
    "nvdiffrast<0.4.0+cu130",
    "o-voxel<0.0.1+cu130",
]

[project.optional-dependencies]
train = [
    "tensorboard",
]

# PyTorch CUDA 12.8 index
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

# PozzettiAndrea precompiled CUDA wheels index
[[tool.uv.index]]
name = "cuda-wheels"
url = "https://pozzettiandrea.github.io/cuda-wheels/"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
xformers = { index = "pytorch-cu128" }
cumesh = { index = "cuda-wheels" }
flex-gemm = { index = "cuda-wheels" }
nvdiffrast = { index = "cuda-wheels" }
o-voxel = { index = "cuda-wheels" }

[tool.setuptools.packages.find]
where = ["."]
include = ["trellis2*", "demo*", "data_toolkit*", "eval*"]
