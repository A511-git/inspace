[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inspace"
version = "0.1.0"
description = "InSpace: Structure-Aware 3D Indoor Scene Generation from a Single 360° Image"
readme = "README.md"
requires-python = ">=3.10, <3.13"
license = { text = "MIT" }
authors = [
    { name = "Gwanhyeong Koo", email = "kookie12@kaist.ac.kr" },
    { name = "NAVER LABS / KAIST" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

# Minimal base dependencies
dependencies = [
    "torch==2.6.0",
    "torchvision==0.21.0",
    "numpy",
    "scipy",
    "pandas",
    "tqdm",
    "easydict",
    "zstandard",
    "safetensors",
    "huggingface_hub",
    "ninja",
]

[project.optional-dependencies]
# Minimal inference & Gradio demo: uv sync --extra infer (or uv sync -E infer)
infer = [
    "opencv-python-headless",
    "imageio",
    "imageio-ffmpeg",
    "Pillow",
    "scikit-image",
    "trimesh",
    "plyfile",
    "open3d",
    "pyrender",
    "py360convert",
    "kornia",
    "timm",
    "matplotlib",
    "plotly",
    "transformers",
    "gradio>=5.0.0,<=6.0.1",
    "utils3d @ git+https://github.com/EasternJournalist/utils3d.git@9a4eb15e4021b67b12c460c7057d642626897ec8",
]

# CUDA extensions (o-voxel from local folder, others from GitHub, no HF token needed)
# Install via: uv sync -E infer -E cuda-extensions
cuda-extensions = [
    "o_voxel",
    "cumesh",
    "flex_gemm",
    "nvdiffrast",
    "nvdiffrec",
]

# Attention backend for Turing / Kaggle T4 / V100: uv sync -E infer -E xformers
xformers = [
    "xformers",
]

# Attention backend for Ampere / Hopper (A100, RTX 3090/4090): uv sync -E infer -E flash-attn
flash-attn = [
    "flash-attn==2.7.3",
]

# Training dependencies
train = [
    "tensorboard",
]

# Benchmark evaluation metrics & scripts
eval = [
    "lpips",
    "pytorch3d @ git+https://github.com/facebookresearch/pytorch3d.git@stable",
]

# PEP 735 Dependency Groups (uv sync --group infer --group cuda-extensions)
[dependency-groups]
infer = [
    "opencv-python-headless",
    "imageio",
    "imageio-ffmpeg",
    "Pillow",
    "scikit-image",
    "trimesh",
    "plyfile",
    "open3d",
    "pyrender",
    "py360convert",
    "kornia",
    "timm",
    "matplotlib",
    "plotly",
    "transformers",
    "gradio>=5.0.0,<=6.0.1",
    "utils3d @ git+https://github.com/EasternJournalist/utils3d.git@9a4eb15e4021b67b12c460c7057d642626897ec8",
]
cuda-extensions = [
    "o_voxel",
    "cumesh",
    "flex_gemm",
    "nvdiffrast",
    "nvdiffrec",
]
dev = [
    "tensorboard",
    "lpips",
]

# uv-specific configuration: auto-fetch PyTorch CUDA 12.4 wheels instead of CPU-only PyPI
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
xformers = { index = "pytorch-cu124" }
o_voxel = { path = "./o-voxel" }
cumesh = { git = "https://github.com/JeffreyXiang/CuMesh.git" }
flex_gemm = { git = "https://github.com/JeffreyXiang/FlexGEMM.git" }
nvdiffrast = { git = "https://github.com/NVlabs/nvdiffrast.git", tag = "v0.4.0" }
nvdiffrec = { git = "https://github.com/JeffreyXiang/nvdiffrec.git", branch = "renderutils" }

# Provide torch and setuptools during isolated building of custom CUDA extensions
[tool.uv.extra-build-dependencies]
cumesh = ["torch", "setuptools"]
flex_gemm = ["torch", "setuptools"]
nvdiffrast = ["torch", "setuptools"]
nvdiffrec = ["torch", "setuptools"]
o_voxel = ["torch", "setuptools"]

[tool.setuptools.packages.find]
where = ["."]
include = ["trellis2*", "demo*", "data_toolkit*", "eval*"]
